# ================================================================
# APPLICATION
# ================================================================
spring.application.name=cutie-collection-backend
server.port=${PORT:8080}

# ================================================================
# POSTGRESQL DATASOURCE
# ================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================================================
# JPA AND HIBERNATE
# ================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ================================================================
# JWT AUTHENTICATION
# IMPORTANT: Match these property names in JwtService/JwtUtil.
# ================================================================
application.jwt.secret=${JWT_SECRET}
application.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ================================================================
# RAZORPAY
# ================================================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ================================================================
# FRONTEND AND CORS
# ================================================================
application.frontend-url=${FRONTEND_URL:http://localhost:5173}
